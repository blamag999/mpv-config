# ============================================================================
# MENU GỢI Ý TỰ ĐỘNG (HIỆN KHI VIDEO < 4K)
# ============================================================================
[Suggest-Upscale-Menu]
profile-cond=get("video-params/w") < 3800
profile-restore=copy
osd-duration=8000
osd-playing-msg="PHÁT HIỆN VIDEO < 4K. CHỌN CHẾ ĐỘ UPSCALE:\n------------------------------------------------\nPHIM ĐIỆN ẢNH (24fps):  [1] Nhẹ   [2] RAVU (Êm)   [3] FSR-16 (Nét căng)\nVIDEO 60FPS / GAME:    [4] FSR-8 (Mượt mà)\nANIME / HOẠT HÌNH:     [5] Nhẹ   [6] ArtCNN (Siêu Đẹp)\nKHÁC:                  [7] Cứu phim vỡ hình (Grain)\n------------------------------------------------\n(Mặc định: Giữ nguyên bản - Bấm [0] để về Zin)"

# ============================================================================
# NHÓM 1: PHIM ĐIỆN ẢNH & VIDEO ĐỜI THỰC
# ============================================================================

# [Phím 1] PHIM CƠ BẢN (Internal) -> Tiết kiệm điện nhất
[Mode-Movie-Internal]
profile-desc=Mode 1: Movie (Internal EWA)
glsl-shaders-clr
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell
correct-downscaling=yes
linear-downscaling=yes
sigmoid-upscaling=yes
deband=yes
deband-iterations=1
deband-threshold=48
osd-duration=2000

# [Phím 2] PHIM CÂN BẰNG (RAVU r3) -> Hình ảnh tự nhiên, đầm mắt
[Mode-Movie-RAVU]
profile-desc=Mode 2: Movie (RAVU r3 + CfL)
glsl-shaders-clr
glsl-shader="~~/shaders/ravu-zoom-ar-r3.hook"
glsl-shader="~~/shaders/CfL_Prediction.glsl"
scale=ewa_lanczos
dscale=mitchell
linear-downscaling=yes
sigmoid-upscaling=yes
deband=yes
deband-iterations=1
deband-threshold=48
osd-duration=2000

# [Phím 3] PHIM ĐIỆN ẢNH CAO CẤP (FSR 16) -> Nét nhất, nặng nhất (Dùng cho 24fps)
[Mode-Movie-FSR16]
profile-desc=Mode 3: Movie (FSRCNNX 16 - Ultra Sharp)
glsl-shaders-clr
glsl-shader="~~/shaders/FSRCNNX_x2_16-0-4-1.glsl"
glsl-shader="~~/shaders/CfL_Prediction.glsl"
scale=ewa_lanczos
dscale=mitchell
linear-downscaling=yes
sigmoid-upscaling=yes
deband=yes
deband-iterations=2
deband-threshold=48
osd-duration=2000

# [Phím 4] VIDEO 60FPS / GAME (FSR 8) -> Nét vừa, nhẹ, đảm bảo không giật
[Mode-Movie-FSR8]
profile-desc=Mode 4: Movie (FSRCNNX 8 - Smooth/60fps)
glsl-shaders-clr
glsl-shader="~~/shaders/FSRCNNX_x2_8-0-4-1.glsl"
glsl-shader="~~/shaders/CfL_Prediction.glsl"
scale=ewa_lanczos
dscale=mitchell
linear-downscaling=yes
sigmoid-upscaling=yes
deband=yes
deband-iterations=2
deband-threshold=48
osd-duration=2000

# ============================================================================
# NHÓM 2: ANIME & HOẠT HÌNH
# ============================================================================

# [Phím 5] ANIME CƠ BẢN (Internal)
[Mode-Anime-Internal]
profile-desc=Mode 5: Anime (Internal Soft)
glsl-shaders-clr
scale=ewa_lanczos
cscale=ewa_lanczossoft
dscale=mitchell
scale-antiring=0.7
cscale-antiring=0.7
deband=yes
deband-iterations=2
deband-threshold=35
osd-duration=2000

# [Phím 6] ANIME SIÊU ĐẸP (ArtCNN) -> Đỉnh cao tái tạo nét vẽ
[Mode-Anime-ArtCNN]
profile-desc=Mode 6: Anime (ArtCNN + Krig)
glsl-shaders-clr
glsl-shader="~~/shaders/ArtCNN_C4F32_DS.glsl"
glsl-shader="~~/shaders/KrigBilateral.glsl"
scale=ewa_lanczos
dscale=mitchell
glsl-shader="~~/shaders/hdeband.glsl"
osd-duration=2000

# ============================================================================
# NHÓM 3: TIỆN ÍCH & SỬA LỖI
# ============================================================================

# [Phím 7] CỨU PHIM XẤU (Grain) -> Che lỗi nén, tạo hạt nhiễu
[Mode-Movie-Grain]
profile-desc=Mode 7: Fix Bad Quality (Grain)
glsl-shaders-clr
glsl-shader="~~/shaders/ravu-zoom-ar-r3.hook"
glsl-shader="~~/shaders/CfL_Prediction.glsl"
scale=ewa_lanczos
dscale=mitchell
deband=yes
deband-iterations=4
deband-threshold=60
glsl-shader="~~/shaders/filmgrain.glsl"
osd-duration=2000

# [Phím 0] VỀ MẶC ĐỊNH (4K Native) -> Tắt mọi thứ
[Mode-Native-4K]
profile-desc=Mode 0: Native 4K (Reset/No Upscale)
glsl-shaders-clr
scale=bilinear
cscale=bilinear
dscale=bilinear
deband=no
osd-duration=2000

# ============================================================================
# ÂM THANH TỰ ĐỘNG (AUTO DOWNMIX 2.1)
# ============================================================================
[Autoload_Downmix_5.1]
profile-cond=get("audio-params/channel-count") >= 5 and get("audio-params/channel-count") < 7
profile-restore=copy-equal
af=lavfi="lowpass=c=LFE:f=120,volume=1.6,pan=stereo|FL=0.5*FC+0.707*FL+0.707*BL+0.5*LFE|FR=0.5*FC+0.707*FR+0.707*BR+0.5*LFE"

[Autoload_Downmix_7.1]
profile-cond=get("audio-params/channel-count") >= 7
profile-restore=copy-equal
af=lavfi="lowpass=c=LFE:f=120,volume=1.6,pan=stereo|FL=0.5*FC+0.3*FLC+0.3*FL+0.3*BL+0.3*SL+0.5*LFE|FR=0.5*FC+0.3*FRC+0.3*FR+0.3*BR+0.3*SR+0.5*LFE"
