# ============================================================================
# SYSTEM: PC -> DAC KS01 -> AIYIMA A07 PRO -> 2.1 SPEAKER
# MONITOR: LG 27UP600 (4K HDR)
# BASE: Optimized by Gemini + Network tweaks from blamag999
# ============================================================================

# Lưu biên dịch shader vào ổ cứng để lần sau mở phim không phải load lại
gpu-shader-cache-dir="~~/shader_cache"

# --- 1. VIDEO & RENDERER ---
profile=high-quality
vo=gpu-next
gpu-api=d3d11
hwdec=auto-safe
# Dither: Giúp màu chuyển vùng mịn hơn (Học từ blamag999)
dither-depth=auto
temporal-dither=yes
dither=fruit

# --- 2. MẶC ĐỊNH: KHÔNG UPSCALE ---
# Mặc định dùng Bilinear (Nhẹ, Chuẩn 4K gốc).
# Menu chọn Upscale sẽ hiện khi video < 4K.
scale=bilinear
cscale=bilinear
dscale=bilinear
deband=no
glsl-shaders-clr

# --- 3. HDR & MÀU SẮC (LG 27UP600) ---
target-colorspace-hint=yes
target-peak=400
# Mobius giữ màu sắc tốt hơn, ít bị bệt màu trắng hơn Spline trên màn độ sáng thấp
tone-mapping=mobius
tone-mapping-param=0.3
gamut-mapping-mode=perceptual
hdr-compute-peak=yes

# --- 4. CACHE & NETWORK (Học từ blamag999) ---
# Tối ưu để xem phim online/Youtube 4K không bị lag
cache=yes
demuxer-max-bytes=1GiB
demuxer-readahead-secs=300
demuxer-max-back-bytes=500MiB
# Youtube-dl settings: Ưu tiên 4K AV1/VP9
ytdl-format=bestvideo+bestaudio/best
load-unsafe-playlists=yes

# --- 5. ÂM THANH (DAC KS01 EXCLUSIVE) ---
ao=wasapi
audio-exclusive=yes
volume=100
volume-max=100

# Sử dụng bộ thư viện SOX để resample chất lượng cao nhất
resample=audio-rate-generator=soxr
audio-resample-linear=yes
# Dither âm thanh để khử nhiễu lượng tử hóa (quan trọng cho DAC)
dither-depth=auto

# Downmix 2.1 (Trộn Center/LFE vào Stereo cho Sub Polk)
audio-channels=stereo
ad-lavc-downmix=yes
audio-normalize-downmix=yes

# --- 6. PHỤ ĐỀ & GIAO DIỆN ---
sub-auto=fuzzy
slang=vi,vie,vietnamese,en,eng
alang=ja,jp,jpn,vi,vie,en,eng
sub-font='Open Sans'
sub-font-size=48
sub-bold=yes
sub-border-size=2
sub-shadow-offset=1
save-position-on-quit=yes
keep-open=yes

# --- 7. SCREENSHOT ---
screenshot-format=png
screenshot-high-bit-depth=no
screenshot-png-compression=7
screenshot-dir="~/Pictures/mpv"
screenshot-template="%F-%wH.%wM.%wS"

# Kích hoạt file profiles
include="~~/profiles.conf"
