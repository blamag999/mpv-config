# ============================================================================
# MPV ULTIMATE CONFIG - RTX 2060 | DAC KS01 | LG 4K HDR
# ============================================================================

# --- 1. GENERAL & PERFORMANCE ---
profile=high-quality
vo=gpu-next
gpu-api=d3d11
hwdec=auto-safe
keep-open=yes
autofit=75%x75%
hr-seek=yes
# Cache shader để khởi động nhanh, không bị khựng khi bật FSRCNNX/ArtCNN
gpu-shader-cache-dir="~~/shader_cache"

# --- 2. HÌNH ẢNH & MÀU SẮC ---
# Mặc định tắt Upscale (Chọn qua Menu phím số)
scale=bilinear
cscale=bilinear
dscale=bilinear
deband=no
glsl-shaders-clr

# Khử nhiễu màu (Dithering) - Tối ưu cho màn LG 8-bit+FRC
dither=fruit
dither-depth=auto
temporal-dither=yes
error-diffusion=sierra-lite

# --- 3. HDR TONE MAPPING (TINH CHỈNH CHO LG 27UP600) ---
target-colorspace-hint=yes
target-peak=400
# Mobius xử lý vùng sáng (highlight) mượt hơn Spline trên màn 400 nits
tone-mapping=mobius
tone-mapping-param=0.3
gamut-mapping-mode=perceptual
hdr-compute-peak=yes

# --- 4. ÂM THANH (AUDIOPHILE DAC) ---
ao=wasapi
audio-exclusive=yes
volume=100
volume-max=100

# Resampler chất lượng cao (SOX) - Đảm bảo độ sạch tuyệt đối
resample=audio-rate-generator=soxr
audio-resample-linear=yes

# Downmix 2.1 (Sub Polk + Tangent)
audio-channels=stereo
ad-lavc-downmix=yes
audio-normalize-downmix=yes
audio-pitch-correction=yes

# --- 5. STREAMING & NETWORK (YOUTUBE 4K) ---
cache=yes
demuxer-max-bytes=2GiB           # Tăng cache lên 2GB cho thoải mái (RAM bạn chắc dư)
demuxer-readahead-secs=300
ytdl-format=bestvideo+bestaudio/best
load-unsafe-playlists=yes

# --- 6. PHỤ ĐỀ & GIAO DIỆN ---
# Ngôn ngữ
alang=ja,jp,jpn,vi,vie,en,eng
slang=vi,vie,vietnamese,en,eng

# Phụ đề đẹp
sub-auto=fuzzy
sub-font='Open Sans'
sub-font-size=48
sub-bold=yes
sub-border-size=2
sub-shadow-offset=1

# Tự tìm sub
sub-file-paths-append=ass
sub-file-paths-append=srt
sub-file-paths-append=sub
sub-file-paths-append=subs
sub-file-paths-append=subtitles

# --- 7. SCREENSHOT & KHÁC ---
screenshot-format=png
screenshot-high-bit-depth=no
screenshot-png-compression=7
screenshot-dir="~/Pictures/mpv"
screenshot-template="%F-%wH.%wM.%wS"
save-position-on-quit=yes

# --- CẤU HÌNH CHO GIAO DIỆN UOSC ---
osc=no                  # Tắt bộ điều khiển cũ (On Screen Controller)
osd-bar=no              # Tắt thanh volume/seek cũ
border=no               # Tắt khung viền Windows (để UOSC tự vẽ viền đẹp hơn)

# Kích hoạt file profiles
include="~~/profiles.conf"
