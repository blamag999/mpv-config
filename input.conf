# ========== GENERAL ==========
Tab        script-binding uosc/toggle-ui
Shift+m    script-binding uosc/menu

SPACE      cycle pause; script-binding uosc/flash-pause-indicator

Shift+RIGHT  seek  10
Shift+LEFT   seek -10
Alt+RIGHT    frame_step
Alt+LEFT     frame_back_step

Ctrl+LEFT   no-osd sub-seek -1
Ctrl+RIGHT  no-osd sub-seek  1

m          no-osd cycle mute; script-binding uosc/flash-volume
Up         no-osd add volume  2; script-binding uosc/flash-volume
Down       no-osd add volume -2; script-binding uosc/flash-volume

[          no-osd add speed -0.25; script-binding uosc/flash-speed
]          no-osd add speed  0.25; script-binding uosc/flash-speed
Bs         no-osd set speed 1.0;    script-binding uosc/flash-speed

PgUp       add chapter 1
PgDn       add chapter -1

f          cycle fullscreen

# ========== MOUSE ==========
MBTN_LEFT_DBL  cycle fullscreen
MBTN_MID       cycle pause
MBTN_RIGHT     script-binding uosc/menu-blurred
WHEEL_UP       seek 5
WHEEL_DOWN     seek -5

# ========== FILE ==========
o         script-binding uosc/open-file
O         script-binding uosc/load-subtitles
Shift+h   script-binding memo-history
Ctrl+r    script-binding reload/reload_resume
w         script-binding uosc/show-in-directory
Ctrl+q    quit
Shift+q   quit_watch_later

# ========== VIDEO PROFILES ==========
Ctrl+1  apply-profile Film;             show-text "Video: Film"
Ctrl+2  apply-profile Film_HQ;          show-text "Video: Film HQ"
Ctrl+3  apply-profile Film_BW_Upscale;  show-text "Video: Film B/W"
Ctrl+4  apply-profile Anime_HQ;         show-text "Video: Anime HQ"
Ctrl+5  apply-profile Anime_LQ;         show-text "Video: Anime LQ"
Ctrl+6  apply-profile Fast;             show-text "Video: Fast"
Ctrl+0  apply-profile Safe_NoShader;    show-text "Video: RAW (no shader)"

b       script-binding autocrop/toggle_crop
h       cycle deband
i       cycle interpolation
d       cycle deinterlace
Ctrl+h  cycle-values hwdec "auto-safe" "auto-copy" "no"

# ========== AUDIO ==========
a        script-binding uosc/audio
Shift+a  script-binding uosc/audio-device

1  apply-profile Audio_Pure;   show-text "Audio: PURE"
2  apply-profile Audio_Movie;  show-text "Audio: MOVIE"
3  apply-profile Audio_Night;  show-text "Audio: NIGHT"

# ========== SUBTITLE ==========
Alt+s   script-binding uosc/subtitles
v       cycle sub-visibility
g       add sub-scale +0.05
Shift+g add sub-scale -0.05
z       add sub-delay -0.042
x       add sub-delay +0.042
Shift+z set sub-delay 0
,       add sub-pos -1
.       add sub-pos +1

# ========== UI ==========
p       script-binding uosc/playlist
c       script-binding uosc/chapters

# ========== MISC ==========
s         async screenshot                      # Screenshot với phụ đề
Shift+s   async screenshot video                # Screenshot không phụ đề
Ctrl+s    async screenshot window               # Screenshot cả cửa sổ

Shift+i   script-binding stats/display-stats-toggle
`         script-binding console/enable
Ctrl+w    script-binding uosc/open-config-directory
