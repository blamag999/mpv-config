# ============================================================================
# MPV INPUT CONFIG - FINAL (RTX 2060 | LG 4K | UOSC)
# ============================================================================

# --- 1. CHỌN CHẾ ĐỘ HÌNH ẢNH (Upscale Profiles) ---
# Dùng dãy phím số để chọn thuật toán. KHÔNG dùng chỉnh màu (Contrast/Bright).

# Nhóm Phim (Movies)
1 apply-profile "Mode-Movie-Internal" ; show-text "Mode 1: Movie (Basic/Light)"
2 apply-profile "Mode-Movie-RAVU"     ; show-text "Mode 2: Movie (RAVU - Balanced)"
3 apply-profile "Mode-Movie-FSR16"    ; show-text "Mode 3: Movie (FSR16 - Ultra Sharp)"
4 apply-profile "Mode-Movie-FSR8"     ; show-text "Mode 4: Movie (FSR8 - Smooth/60fps)"

# Nhóm Hoạt hình (Anime)
5 apply-profile "Mode-Anime-Internal" ; show-text "Mode 5: Anime (Basic)"
6 apply-profile "Mode-Anime-ArtCNN"   ; show-text "Mode 6: Anime (ArtCNN - Ultra Beauty)"

# Nhóm Sửa lỗi & Mặc định
7 apply-profile "Mode-Movie-Grain"    ; show-text "Mode 7: Fix Bad Quality (Grain)"
0 apply-profile "Mode-Native-4K"      ; show-text "Mode 0: Native 4K (Reset)"


# --- 2. ÂM THANH (Audio & Night Mode) ---
# Phím 'n': Bật/Tắt chế độ ban đêm (Nén tiếng nổ, Tăng tiếng thoại)
n cycle-values af "lavfi=[dynaudnorm=f=250:g=31:p=0.5]" "" ; show-text "Night Mode: ${?af==:OFF}${!af==:ON}"

VOLUME_UP    add volume  2
VOLUME_DOWN  add volume -2
MUTE         cycle mute
WHEEL_UP     add volume  2
WHEEL_DOWN   add volume -2


# --- 3. ĐIỀU KHIỂN PHÁT (Playback Control) ---
SPACE        cycle pause                  # Phím Cách: Play/Pause
ENTER        cycle fullscreen             # Enter: Toàn màn hình
ESC          set fullscreen no            # ESC: Thoát toàn màn hình
q            quit                         # q: Tắt ngay lập tức

# Chuột (Mouse)
MBTN_LEFT    cycle pause                  # Click trái: Play/Pause
MBTN_LEFT_DBL cycle fullscreen            # Click đúp: Toàn màn hình
MBTN_RIGHT   script-binding uosc/menu     # Click phải: Hiện Menu UOSC (Đẹp)

# Tua phim (Seeking)
RIGHT        seek  5                      # Mũi tên Phải: Tua 5s
LEFT         seek -5                      # Mũi tên Trái: Lùi 5s
UP           seek  60                     # Mũi tên Lên: Tua 1 phút
DOWN         seek -60                     # Mũi tên Xuống: Lùi 1 phút

# Tua nhanh bằng Lăn chuột (Dành cho chuột không có Tilt Wheel)
Shift+WHEEL_UP    seek  10                # Giữ Shift + Lăn lên: Tua 10s
Shift+WHEEL_DOWN  seek -10                # Giữ Shift + Lăn xuống: Lùi 10s


# --- 4. PHỤ ĐỀ (Subtitles) ---
j            cycle sub                    # j: Chọn sub tiếp theo
v            cycle sub-visibility         # v: Ẩn/Hiện sub
z            add sub-delay -0.05          # z: Chỉnh sub sớm hơn (trị lệch sub)
x            add sub-delay +0.05          # x: Chỉnh sub trễ hơn
r            add sub-pos -1               # r: Kéo sub lên cao
t            add sub-pos +1               # t: Kéo sub xuống thấp



# --- 5. YOUTUBE & STREAMING (Xử lý sự cố) ---
# Alt+v: Ép chạy VP9 (Mượt cho RTX 2060)
Alt+v set ytdl-format "bestvideo[vcodec*=vp9]+bestaudio/best"; show-text "Reloading: VP9 (GPU Friendly)..."; loadfile "${path}"

# Alt+a: Ép chạy AV1 (Đẹp, dùng CPU)
Alt+a set ytdl-format "bestvideo[vcodec*=av01]+bestaudio/best"; show-text "Reloading: AV1 (CPU Heavy)..."; loadfile "${path}"

# Ctrl+v: Dán Link từ Clipboard (Mặc định của UOSC) để xem Youtube
Ctrl+v       script-binding uosc/paste-to-open


# --- 6. GIAO DIỆN UOSC & TIỆN ÍCH KHÁC ---
TAB          script-binding uosc/toggle-ui # TAB: Bật Menu điều khiển xịn
p            script-binding uosc/playlist  # p: Danh sách phát
c            script-binding uosc/chapters  # c: Chọn chương (Chapter)
o            script-binding uosc/open-file # o: Mở file
s            async screenshot              # s: Chụp ảnh (Có sub)
Shift+s      async screenshot video        # Shift+s: Chụp ảnh (Sạch, không sub)
i            script-binding stats/display-stats       # i: Xem thông tin kỹ thuật (Tạm thời)
Shift+i      script-binding stats/display-stats-toggle # Shift+i: Xem thông tin (Ghim luôn)
