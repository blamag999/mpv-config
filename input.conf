# ============================================================================
# INPUT CONFIG - FINAL VERSION (TỐI ƯU CHO DÀN 2.1 + LG 4K)
# ============================================================================

# --- 1. CÁC CHẾ ĐỘ UPSCALE (Thay thế chỉnh màu sắc) ---
# Chúng ta dùng phím số để chọn thuật toán hình ảnh thay vì chỉnh Brightness/Contrast
# Lý do: Màn 4K HDR nên để màu gốc, không nên can thiệp bằng phần mềm.

1 apply-profile "Mode-Movie-Internal" ; show-text "Mode 1: Movie (Basic)"  #! Upscale > Movie (Basic)
2 apply-profile "Mode-Movie-RAVU"     ; show-text "Mode 2: Movie (RAVU)"   #! Upscale > Movie (Balanced)
3 apply-profile "Mode-Movie-FSRCNNX"  ; show-text "Mode 3: Movie (Sharp)"  #! Upscale > Movie (Ultra Sharp)
4 apply-profile "Mode-Anime-Internal" ; show-text "Mode 4: Anime (Basic)"  #! Upscale > Anime (Basic)
5 apply-profile "Mode-Anime-ArtCNN"   ; show-text "Mode 5: Anime (ArtCNN)" #! Upscale > Anime (Ultra Beauty)
6 apply-profile "Mode-Movie-Grain"    ; show-text "Mode 6: Fix Bad Quality" #! Upscale > Fix Bad Quality (Grain)
0 apply-profile "Mode-Native-4K"      ; show-text "Mode 0: Native 4K"      #! Upscale > Reset (Native 4K)

# --- 2. ÂM THANH (TỐI ƯU CHO LOA 2.1 & DAC) ---
# Phím "n": Chế độ ban đêm (Night Mode).
# Tác dụng: Tự động nén tiếng nổ to xuống và nâng tiếng thoại lên.
n cycle-values af "lavfi=[dynaudnorm=f=250:g=31:p=0.5]" "" ; show-text "Night Mode (Audio Normalization)" #! Audio > Toggle Night Mode

VOLUME_UP    add volume  2
VOLUME_DOWN  add volume -2
MUTE         cycle mute
WHEEL_UP     add volume  2
WHEEL_DOWN   add volume -2

# --- 3. ĐIỀU KHIỂN CƠ BẢN (General) ---
SPACE        cycle pause                  #! Play/Pause
MBTN_LEFT    cycle pause                  #! Play/Pause (Click chuột)
MBTN_LEFT_DBL cycle fullscreen            #! Fullscreen (Click đúp)
ENTER        cycle fullscreen             #! Fullscreen
f            cycle fullscreen             #! Fullscreen
ESC          set fullscreen no            #! Exit Fullscreen
q            quit                         #! Quit

# Tua nhanh/chậm
RIGHT        seek  5                      #! Seek > Forward 5s
LEFT         seek -5                      #! Seek > Backward 5s
UP           seek  60                     #! Seek > Forward 1m
DOWN         seek -60                     #! Seek > Backward 1m
WHEEL_RIGHT  seek  10
WHEEL_LEFT   seek -10

# Chụp ảnh màn hình (Screenshot)
s            async screenshot             #! Screenshot > With Subtitles
Shift+s      async screenshot video       #! Screenshot > No Subtitles
Ctrl+s       async screenshot window      #! Screenshot > Window

# --- 4. PHỤ ĐỀ (Subtitle) ---
j            cycle sub                    #! Subtitles > Next Track
k            cycle sub down               #! Subtitles > Prev Track
v            cycle sub-visibility         #! Subtitles > Toggle Visibility
z            add sub-delay -0.05          #! Subtitles > Timing > Delay -50ms
x            add sub-delay +0.05          #! Subtitles > Timing > Delay +50ms
r            add sub-pos -1               #! Subtitles > Position > Move Up
t            add sub-pos +1               #! Subtitles > Position > Move Down

# --- 5. CÁC MENU CỦA UOSC (Giữ lại nếu bạn có cài UOSC) ---
# Nếu không cài UOSC, các phím này sẽ không hoạt động hoặc báo lỗi (không sao cả).
Tab          script-binding uosc/toggle-ui   #! Menu > Toggle UI
Right_Click  script-binding uosc/menu        #! Menu > Context Menu
p            script-binding uosc/playlist    #! Menu > Playlist
c            script-binding uosc/chapters    #! Menu > Chapters
o            script-binding uosc/open-file   #! File > Open File
/            script-binding console/enable   #! Misc > Console

# --- 6. THÔNG SỐ KỸ THUẬT ---
i            script-binding stats/display-stats       #! Misc > Stats (Temporary)
Shift+i      script-binding stats/display-stats-toggle #! Misc > Stats (Permanent)
