# ============================================================================
# ĐIỀU KHIỂN & PHÍM TẮT (RTX 2060 / 4K LG)
# ============================================================================

# --- 1. CHỌN CHẾ ĐỘ HÌNH ẢNH (PHÍM SỐ) ---

# Nhóm Phim (Movie)
1 apply-profile "Mode-Movie-Internal" ; show-text "Mode 1: Movie (Internal - Light)"
2 apply-profile "Mode-Movie-RAVU"     ; show-text "Mode 2: Movie (RAVU r3 - Balanced)"
3 apply-profile "Mode-Movie-FSR16"    ; show-text "Mode 3: Movie (FSR16 - Ultra Sharp)"
4 apply-profile "Mode-Movie-FSR8"     ; show-text "Mode 4: Movie (FSR8 - Smooth/60fps)"

# Nhóm Anime
5 apply-profile "Mode-Anime-Internal" ; show-text "Mode 5: Anime (Internal - Light)"
6 apply-profile "Mode-Anime-ArtCNN"   ; show-text "Mode 6: Anime (ArtCNN - Ultra Beauty)"

# Nhóm Tiện ích
7 apply-profile "Mode-Movie-Grain"    ; show-text "Mode 7: Fix Bad Quality (Grain)"
0 apply-profile "Mode-Native-4K"      ; show-text "Mode 0: Native 4K (Reset)"

# --- 2. ÂM THANH (AUDIO 2.1) ---
# Chế độ xem đêm (Night Mode): Cân bằng âm lượng nổ/thoại
n cycle-values af "lavfi=[dynaudnorm=f=250:g=31:p=0.5]" "" ; show-text "Audio Night Mode: ${?af==:OFF}${!af==:ON}"

VOLUME_UP    add volume  2
VOLUME_DOWN  add volume -2
MUTE         cycle mute
WHEEL_UP     add volume  2
WHEEL_DOWN   add volume -2

# --- 3. CHUỘT & ĐIỀU KHIỂN ---
MBTN_LEFT    cycle pause                  # Click trái: Play/Pause
MBTN_LEFT_DBL cycle fullscreen            # Click đúp: Fullscreen
ENTER        cycle fullscreen
SPACE        cycle pause
ESC          set fullscreen no
q            quit

# Tua phim
RIGHT        seek  5
LEFT         seek -5
UP           seek  60
DOWN         seek -60
# Tua nhanh bằng Shift + Lăn chuột (Thay cho Tilt Wheel)
Shift+WHEEL_UP    seek  10
Shift+WHEEL_DOWN  seek -10

# --- 4. PHỤ ĐỀ & KHÁC ---
j            cycle sub
v            cycle sub-visibility
z            add sub-delay -0.05
x            add sub-delay +0.05
s            async screenshot             # Chụp ảnh
Shift+s      async screenshot video       # Chụp ảnh (Không sub)
TAB          script-binding uosc/toggle-ui # Menu UOSC (Nếu có cài)
